<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2150"/>
      <stop offset="1" stop-color="#2E3FA8"/>
    </linearGradient>

    <!-- The mark: prompt chevron + tab-built "S" + AI spark -->
    <g id="mark">
      <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
      <!-- faint tab strip along the top, a nod to pinned tabs -->
      <rect x="72" y="70" width="92" height="22" rx="11" fill="#8FA2FF" opacity="0.55"/>
      <rect x="176" y="70" width="64" height="22" rx="11" fill="#8FA2FF" opacity="0.28"/>
      <!-- prompt chevron -->
      <polyline points="92,196 160,256 92,316" fill="none" stroke="#8FA2FF"
                stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- geometric S, drawn like a terminal glyph -->
      <path d="M 410 176 H 282 Q 236 176 236 222 V 226 Q 236 262 282 262 H 364 Q 410 262 410 308 V 312 Q 410 348 364 348 H 226"
            fill="none" stroke="#EEF1FA" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- cursor block -->
      <rect x="206" y="392" width="224" height="26" rx="6" fill="#FFB547"/>
      <!-- AI spark, centered above the S -->
      <path d="M 318 72 Q 322 102 350 106 Q 322 110 318 140 Q 314 110 286 106 Q 314 102 318 72 Z" fill="#FFB547"/>
    </g>
  </defs>

  <rect width="1200" height="760" fill="#F3F5FB"/>

  <!-- Primary app icon -->
  <use href="#mark" x="64" y="64" transform="scale(1)" />

  <!-- Horizontal lockup on light -->
  <g transform="translate(640,120)">
    <use href="#mark" transform="scale(0.25)"/>
    <text x="152" y="86" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
          font-size="58" font-weight="600" fill="#1A2150" letter-spacing="-1">Terminal<tspan fill="#2E3FA8" font-weight="800">S</tspan></text>
  </g>

  <!-- Horizontal lockup on dark -->
  <rect x="616" y="300" width="536" height="176" rx="24" fill="#1A2150"/>
  <g transform="translate(652,324)">
    <use href="#mark" transform="scale(0.25)"/>
    <text x="152" y="86" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
          font-size="58" font-weight="600" fill="#EEF1FA" letter-spacing="-1">Terminal<tspan fill="#FFB547" font-weight="800">S</tspan></text>
  </g>

  <!-- Small-size checks -->
  <g transform="translate(640,540)">
    <use href="#mark" transform="scale(0.1875)"/>
    <use href="#mark" transform="translate(130,24) scale(0.125)"/>
    <use href="#mark" transform="translate(222,40) scale(0.0625)"/>
  </g>

  <!-- Palette -->
  <g transform="translate(64,640)" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" fill="#1A2150">
    <rect width="56" height="56" rx="12" fill="#1A2150"/><text x="0" y="80">#1A2150</text>
    <rect x="120" width="56" height="56" rx="12" fill="#2E3FA8"/><text x="120" y="80">#2E3FA8</text>
    <rect x="240" width="56" height="56" rx="12" fill="#8FA2FF"/><text x="240" y="80">#8FA2FF</text>
    <rect x="360" width="56" height="56" rx="12" fill="#FFB547"/><text x="360" y="80">#FFB547</text>
  </g>
</svg>
