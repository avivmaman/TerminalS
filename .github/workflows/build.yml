name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      # On main, build as the next unreleased version (0.2.0-beta.1 released ->
      # 0.2.0-beta.2), so every merge ships as an update the app can install.
      - name: Pick the release version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          taken=$( (gh release list --limit 1000 --json tagName --jq '.[].tagName'; git ls-remote --tags origin | sed 's#.*refs/tags/##; s#\^{}##') | sort -u)
          version=$(printf '%s\n' "$taken" | node scripts/next-version.js)
          echo "Releasing as $version"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # --publish never: releases are created by the job below, not electron-builder.
      - name: Build installer and portable .exe
        run: npm run dist -- --publish never

      - name: List build output
        run: Get-ChildItem dist -File | Format-Table Name, Length -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: TerminalS-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.yml
            !dist/builder-debug.yml
            !dist/builder-effective-config.yaml
          if-no-files-found: error

  # Publishes a release on every push to main (as the version picked above), or
  # when a v* tag is pushed.
  # Versions with a pre-release part (0.2.0-beta.1) become GitHub pre-releases.
  # The .yml and .blockmap files are what the in-app updater reads.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TerminalS-windows
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${{ needs.windows.outputs.version }}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          # Beta installs read beta.yml first; stable installs read latest.yml.
          # Both describe the same installer, so beta users get stable releases too.
          [ -f dist/beta.yml ] || cp dist/latest.yml dist/beta.yml
          flags=()
          title="TerminalS $tag"
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
            title="$title (Beta)"
          fi
          gh release create "$tag" dist/*.exe dist/*.blockmap dist/*.yml "${flags[@]}" \
            --target "$GITHUB_SHA" --title "$title" --generate-notes
