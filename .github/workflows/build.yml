name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      # --publish never: releases are created by the job below, not electron-builder.
      - name: Build installer and portable .exe
        run: npm run dist -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: TerminalS-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  # Publishes a release for the version in package.json: on every push to main
  # (skipped when that version is already released), or when a v* tag is pushed.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TerminalS-windows
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump the version in package.json to publish a new one."
            exit 0
          fi
          gh release create "$tag" dist/*.exe --target "$GITHUB_SHA" --title "TerminalS $tag" --generate-notes
